<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeloCloudiX - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea, #764ba2); height: 100vh; display: flex; align-items: center; }
        .login-container { background: white; border-radius: 15px; padding: 2rem; max-width: 400px; width: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-container">
            <div class="text-center mb-4">
                <h2>VeloCloudiX</h2>
                <p class="text-muted">Sistema Monitoraggio Cloud</p>
            </div>

            {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
            {% endif %}

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" name="username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Accedi</button>
            </form>

            <div class="mt-3 text-center">
                <small class="text-muted">
                    <strong>Credenziali test:</strong><br>
                    admin / admin123<br>
                    operatore / operatore123
                </small>
            </div>
        </div>
    </div>
</body>
</html>
